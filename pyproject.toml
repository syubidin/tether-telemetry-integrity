[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tether-telemetry-integrity"
version = "1.1.0"
description = "A lightweight ML-assisted telemetry integrity gate for motorsport-style time series."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TETHER contributors"}]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
  "streamlit>=1.54,<2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]
public-data = ["h5py>=3.10,<4.0"]
dev = ["pytest>=8.0,<10.0", "ruff>=0.6,<1.0", "httpx>=0.27,<1.0", "pip-audit>=2.7,<3.0", "bandit>=1.7,<2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]
