name: Quality and security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Ruff
        run: ruff check app.py src tests scripts
      - name: Bandit
        run: bandit -q -r src scripts app.py
      - name: Dependency audit
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-api.txt

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++17 core
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native core
        run: cmake --build build --config Release --parallel 2
      - name: Run native smoke test
        run: ctest --test-dir build --output-on-failure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
